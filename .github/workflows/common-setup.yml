name: Common Setup

on:
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.check.outputs.has_node }}
      has_go: ${{ steps.check.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect npm lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.lockfile.outputs.found == 'true' && 'npm' || '' }}

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> $GITHUB_OUTPUT
          else
            echo "has_node=false" >> $GITHUB_OUTPUT
          fi

          if [ -f go.mod ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci --no-audit --no-fund
            else
              echo "No lockfile found — falling back to npm install"
              npm install --no-audit --no-fund
            fi
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Type check / Go vet
        run: |
          if [ -f package.json ]; then
            npm run typecheck || true
          elif [ -f go.mod ]; then
            go vet ./...
          else
            echo "No typecheck configured"
          fi

      - name: Lint
        run: |
          if [ -f package.json ]; then
            if grep -Eq '"next"\s*:' package.json; then
              echo "Next.js project detected — running next lint"
              npx next lint || true
            elif grep -Eq '"react"\s*:' package.json; then
              echo "React project detected — running npm lint"
              npm run lint || true
            else
              echo "Node project detected — running npm lint"
              npm run lint || true
            fi
          elif [ -f go.mod ]; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.59.0 || true
            $(go env GOPATH)/bin/golangci-lint run ./... || true
          else
            echo "No lint configured"
          fi

      - name: Test
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          elif [ -f go.mod ]; then
            go test ./...
          else
            echo "No tests to run"
          fi

      - name: Build
        run: |
          if [ -f package.json ]; then
            if grep -Eq '"next"\s*:' package.json; then
              echo "Next.js project detected — running next build"
              npx next build || true
            else
              npm run build --if-present
            fi
          elif [ -f go.mod ]; then
            go build ./... || true
          else
            echo "No build step configured"
          fi
