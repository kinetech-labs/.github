name: Notify

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      title:
        required: true
        type: string
      description:
        required: true
        type: string
      url:
        required: true
        type: string

    secrets:
      webhook:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Build payload
        id: payload
        shell: bash
        run: |
          case "${{ inputs.status }}" in
            success)
              COLOR=3066993
              ICON="🟢"
              STATUS="✅ Success"
              ;;
            warning)
              COLOR=16776960
              ICON="🟡"
              STATUS="⚠️ Warning"
              ;;
            info)
              COLOR=3447003
              ICON="🔵"
              STATUS="ℹ️ Information"
              ;;
            *)
              COLOR=15158332
              ICON="🔴"
              STATUS="❌ Failure"
              ;;
          esac

          cat > payload.json <<EOF
          {
            "username": "Kinetech Labs Bot",
            "embeds": [
              {
                "title": "$ICON ${{ inputs.title }}",
                "description": "${{ inputs.description }}",
                "color": $COLOR,
                "url": "${{ inputs.url }}",
                "fields": [
                  {
                    "name": "Repository",
                    "value": "${{ github.event.repository.name }}",
                    "inline": true
                  },
                  {
                    "name": "Workflow",
                    "value": "${{ github.workflow }}",
                    "inline": true
                  },
                  {
                    "name": "Status",
                    "value": "$STATUS",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "${{ github.ref_name }}",
                    "inline": true
                  },
                  {
                    "name": "Actor",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "Event",
                    "value": "${{ github.event_name }}",
                    "inline": true
                  },
                  {
                    "name": "Run",
                    "value": "[#${{ github.run_number }}](${{ inputs.url }})",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Kinetech Labs • GitHub Actions"
                }
              }
            ]
          }
          EOF

      - name: Send notification
        env:
          WEBHOOK: ${{ secrets.webhook }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -X POST \
            --data @payload.json \
            "$WEBHOOK"
