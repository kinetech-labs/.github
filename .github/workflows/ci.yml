name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    name: Guard — prevent direct pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect direct push to main
        run: |
          echo "❌ Direct push to main detected"
          echo "Use a Pull Request instead"
          exit 1

  run-common:
    name: Run common setup and tooling
    needs: [guard]
    uses: ./.github/workflows/common-setup.yml
