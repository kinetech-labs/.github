name: Commit Message Lint

on:
  workflow_call:

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log origin/main..HEAD --pretty=format:%s > commits.txt

          echo "Checking commit messages..."

          # `git log --pretty=format:%s` does not emit a trailing newline after
          # the last entry, so a plain `while read` silently drops the final
          # (most recent) commit. The `|| [ -n "$commit" ]` clause makes sure
          # that last line is still processed.
          while IFS= read -r commit || [ -n "$commit" ]; do
            [ -z "$commit" ] && continue
            if ! echo "$commit" | grep -Eq "^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?: .+"; then
              echo "❌ Invalid commit message: $commit"
              exit 1
            fi
          done < commits.txt
