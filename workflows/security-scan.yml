name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    name: Guard — prevent direct pushes to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent direct push to main
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "❌ Direct push to main detected"
            echo "Use a Pull Request instead"
            exit 1
          else
            echo "Not a direct push to main — continuing"
          fi

  common:
    name: Common setup
    needs: [guard]
    uses: ./.github/workflows/common-setup.yml

  scan:
    name: Security scan
    needs: [common]
    runs-on: ubuntu-latest
    steps:
      - name: Run language-specific security checks
        run: |
          if [ -f package.json ]; then
            echo "Running npm audit"
            npm audit --audit-level=high || true
          elif [ -f go.mod ]; then
            echo "Go project detected — running govulncheck"
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./... || true
          else
            echo "No recognized project files for security scanning"
          fi
